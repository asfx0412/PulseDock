name: Release PulseDock

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag and build
        shell: zsh
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          ./scripts/build.sh
      - name: Create signed updater manifest
        shell: zsh
        env:
          PULSEDOCK_UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.PULSEDOCK_UPDATE_PRIVATE_KEY_BASE64 }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ZIP="PulseDock-${VERSION}.zip"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ZIP}"
          NOTES="outputs/PulseDock-${VERSION}发布说明.md"
          test -s "$NOTES"
          swift scripts/create_update_manifest.swift "$VERSION" "$URL" "outputs/$ZIP" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$NOTES" latest-macos-arm64.json
      - name: Verify manifest against release archive
        shell: zsh
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ZIP="PulseDock-${VERSION}.zip"
          test -s latest-macos-arm64.json
          /usr/bin/shasum -a 256 "outputs/$ZIP" | /usr/bin/awk '{print $1}' | /usr/bin/grep -qi "$(/usr/bin/plutil -extract sha256 raw -o - latest-macos-arm64.json)"
          /usr/bin/plutil -extract version raw -o - latest-macos-arm64.json | /usr/bin/grep -qx "$VERSION"
          PUBLIC_KEY="$(/usr/bin/sed -n 's/.*publicKeyBase64 = "\([^"]*\)".*/\1/p' Sources/PulseDock/Services/AppUpdateService.swift)"
          test -n "$PUBLIC_KEY"
          swift scripts/verify_update_manifest.swift latest-macos-arm64.json "$PUBLIC_KEY"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          gh release create "v${VERSION}" "outputs/PulseDock-${VERSION}.zip" latest-macos-arm64.json --title "PulseDock v${VERSION}" --notes-file "outputs/PulseDock-${VERSION}发布说明.md"

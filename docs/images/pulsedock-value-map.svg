<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">PulseDock 工作状态驾驶舱</title>
  <desc id="desc">AI 开发工作流中的信号汇入 PulseDock 浮窗，帮助开发者决定下一步。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="dock" x1="0" x2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1200" height="500" rx="32" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700">让分散的工作信号，变成下一步判断</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#1e293b">
    <g><rect x="64" y="130" width="212" height="68" rx="18" fill="#fff" stroke="#bfdbfe"/><text x="170" y="172" text-anchor="middle">Codex · AI 网络</text></g>
    <g><rect x="64" y="222" width="212" height="68" rx="18" fill="#fff" stroke="#bfdbfe"/><text x="170" y="264" text-anchor="middle">SSH · GPU · Slurm</text></g>
    <g><rect x="64" y="314" width="212" height="68" rx="18" fill="#fff" stroke="#bfdbfe"/><text x="170" y="356" text-anchor="middle">专注 · 前台应用</text></g>
  </g>
  <g stroke="#60a5fa" stroke-width="4" fill="none" stroke-linecap="round"><path d="M276 164h104"/><path d="M276 256h104"/><path d="M276 348h104"/></g>
  <g filter="url(#shadow)">
    <rect x="380" y="112" width="440" height="290" rx="28" fill="url(#dock)"/>
    <text x="424" y="164" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="700">PulseDock</text>
    <text x="424" y="197" fill="#bfdbfe" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">低干扰的 macOS 工作状态浮窗</text>
    <rect x="424" y="226" width="352" height="52" rx="14" fill="#ffffff" fill-opacity=".13"/>
    <circle cx="452" cy="252" r="8" fill="#34d399"/><text x="474" y="258" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">当前状态：可以继续专注</text>
    <rect x="424" y="296" width="164" height="70" rx="14" fill="#ffffff" fill-opacity=".13"/>
    <text x="444" y="325" fill="#bfdbfe" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">需要处理</text><text x="444" y="351" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700">网络 / 额度</text>
    <rect x="610" y="296" width="166" height="70" rx="14" fill="#ffffff" fill-opacity=".13"/>
    <text x="630" y="325" fill="#bfdbfe" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">按需展开</text><text x="630" y="351" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700">设备 / 诊断</text>
  </g>
  <path d="M820 257h104" stroke="#60a5fa" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#1e293b">
    <rect x="924" y="178" width="214" height="158" rx="24" fill="#fff" stroke="#bfdbfe"/>
    <text x="1031" y="224" text-anchor="middle" font-size="16" fill="#64748b">一眼确认</text>
    <text x="1031" y="263" text-anchor="middle" font-size="23" font-weight="700">现在该做什么？</text>
    <text x="1031" y="298" text-anchor="middle" font-size="16">专注 · 调试 · 等待</text>
  </g>
  <text x="600" y="454" text-anchor="middle" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">本地优先 · 可选连接器 · 明确隐私边界</text>
</svg>
